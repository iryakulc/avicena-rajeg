<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Guru — SMK Avicena Rajeg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="auth-guru.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <span class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        <span>SMK AVICENA RAJEG</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold" href="auth-guru.html"><i class="fa-solid fa-chalkboard-user me-1"></i> Guru</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="auth-siswa.html"><i class="fa-solid fa-user-graduate me-1"></i> Siswa</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">

      <div id="loginBox">
        <div class="text-center mb-3">
          <span class="badge rounded-pill bg-primary bg-opacity-25 text-blue px-3 py-2 border border-primary border-opacity-25 small">
            <i class="fa-solid fa-chalkboard-user me-1"></i> PORTAL GURU
          </span>
        </div>
        <h2 class="auth-title">Masuk Guru</h2>

        <form id="formLogin" onsubmit="handleLoginGuru(event)">
          <div class="form-group-custom">
            <label class="form-label-custom">Nama Lengkap & Gelar</label>
            <input type="text" id="loginNama" class="form-control form-control-glass" placeholder="Nama Lengkap & Gelar" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Password</label>
            <input type="password" id="loginPassword" class="form-control form-control-glass" placeholder="••••••" required>
          </div>

          <div class="auth-links">
            <a href="javascript:void(0)" onclick="forgotPasswordOTPGuru(); return false;">Lupa Password?</a>
          </div>

          <button type="submit" class="btn btn-glass">MASUK PORTAL GURU <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </form>

        <div class="toggle-text">
          Belum punya akun guru? <a href="javascript:void(0)" onclick="switchForm('signup'); return false;">Daftar Akun Guru</a>
        </div>
      </div>

      <div id="signupBox" style="display: none;">
        <div class="text-center mb-3">
          <span class="badge rounded-pill bg-success bg-opacity-25 text-emerald px-3 py-2 border border-success border-opacity-25 small">
            <i class="fa-solid fa-user-plus me-1"></i> PENDAFTARAN GURU
          </span>
        </div>
        <h2 class="auth-title">Daftar Akun Guru</h2>

        <form id="formSignup" onsubmit="handleSignupGuru(event)">
          <div class="form-group-custom">
            <label class="form-label-custom">Nama Lengkap & Gelar</label>
            <input type="text" id="regNama" class="form-control form-control-glass" placeholder="Nama Lengkap & Gelar" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">No. Telepon / WhatsApp</label>
            <input type="tel" id="regHp" class="form-control form-control-glass" placeholder="Contoh: 08** **** ****" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom"><i class="fa-solid fa-book me-1"></i> Mata Pelajaran Umum</label>
            <div class="mapel-chips-container">
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_pai" value="PAI & BP"><label for="mu_pai">PAI</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_pancasila" value="Pancasila/PPKn"><label for="mu_pancasila">PPKN</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_indo" value="B. Indonesia"><label for="mu_indo">B. Indonesia</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_mtk" value="Matematika"><label for="mu_mtk">Matematika</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_sejarah" value="Sejarah Indonesia"><label for="mu_sejarah">Sejarah</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_ing" value="B. Inggris"><label for="mu_ing">B. Inggris</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_pjok" value="PJOK"><label for="mu_pjok">PJOK</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_seni" value="Seni Budaya"><label for="mu_seni">Seni Budaya</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_ipas" value="IPAS"><label for="mu_ipas">IPAS</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_informa" value="Informatika"><label for="mu_informa">Informatika</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelUmum" id="mu_pkwu" value="PKWU"><label for="mu_pkwu">KIK</label></div>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom"><i class="fa-solid fa-laptop-code me-1"></i> Mata Pelajaran Kejuruan (6 Jurusan)</label>
            <div class="mapel-chips-container">
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_tkj" value="Kejuruan TKJ"><label for="mk_tkj"><i class="fa-solid fa-network-wired me-1"></i> TKJ</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_dkv" value="Kejuruan DKV"><label for="mk_dkv"><i class="fa-solid fa-palette me-1"></i> DKV</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_mp" value="Kejuruan MP"><label for="mk_mp"><i class="fa-solid fa-briefcase me-1"></i> MP</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_akl" value="Kejuruan AKL"><label for="mk_akl"><i class="fa-solid fa-calculator me-1"></i> AKL</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_tkr" value="Kejuruan TKR"><label for="mk_tkr"><i class="fa-solid fa-car me-1"></i> TKR</label></div>
              <div class="chip-checkbox"><input type="checkbox" name="mapelKejuruan" id="mk_tbsm" value="Kejuruan TBSM"><label for="mk_tbsm"><i class="fa-solid fa-motorcycle me-1"></i> TBSM</label></div>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Buat Password</label>
            <input type="password" id="regPassword" class="form-control form-control-glass" placeholder="Minimal 6 Karakter" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom text-info"><i class="fa-solid fa-key me-1"></i> Kode Unik Guru Avicena</label>
            <input type="text" id="regKodeUnik" class="form-control form-control-glass border-info" placeholder="GURUAVC2026" required>
          </div>

          <button type="submit" class="btn btn-glass">DAFTAR AKUN GURU <i class="fa-solid fa-check-circle ms-2"></i></button>
        </form>

        <div class="toggle-text">
          Sudah punya akun? <a href="javascript:void(0)" onclick="switchForm('login'); return false;">Masuk ke Login</a>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth-guru.js"></script>
</body>
</html>

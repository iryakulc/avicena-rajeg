<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Siswa — SMK Avicena Rajeg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="auth-siswa.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <span class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        <span>SMK AVICENA RAJEG</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="auth-guru.html"><i class="fa-solid fa-chalkboard-user me-1"></i> Guru</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold" href="auth-siswa.html"><i class="fa-solid fa-user-graduate me-1"></i> Siswa</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">

      <div id="loginBox">
        <div class="text-center mb-3">
          <span class="badge rounded-pill bg-primary bg-opacity-25 text-blue px-3 py-2 border border-primary border-opacity-25 small">
            <i class="fa-solid fa-user-graduate me-1"></i> PORTAL SISWA
          </span>
        </div>
        <h2 class="auth-title">Masuk Akun</h2>

        <form id="formLogin" onsubmit="handleLogin(event)">
          <div class="form-group-custom">
            <label class="form-label-custom">NISN</label>
            <input type="number" id="loginNisn" class="form-control form-control-glass" placeholder="Masukkan 10 digit NISN" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Password</label>
            <input type="password" id="loginPassword" class="form-control form-control-glass" placeholder="••••••" required>
          </div>

          <div class="auth-links">
            <a href="javascript:void(0)" onclick="forgotPasswordOTP(); return false;">Lupa Password?</a>
          </div>

          <button type="submit" class="btn btn-glass">MASUK SEKARANG <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </form>

        <div class="toggle-text">
          Belum punya akun siswa? <a href="javascript:void(0)" onclick="switchForm('signup'); return false;">Daftar Akun Baru</a>
        </div>
      </div>

      <div id="signupBox" style="display: none;">
        <div class="text-center mb-3">
          <span class="badge rounded-pill bg-success bg-opacity-25 text-emerald px-3 py-2 border border-success border-opacity-25 small">
            <i class="fa-solid fa-user-plus me-1"></i> PENDAFTARAN SISWA
          </span>
        </div>
        <h2 class="auth-title">Buat Akun Baru</h2>

        <form id="formSignup" onsubmit="handleSignup(event)">
          <div class="form-group-custom">
            <label class="form-label-custom">Nama Lengkap Siswa</label>
            <input type="text" id="regNama" class="form-control form-control-glass" placeholder="Nama Lengkap" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">NISN</label>
            <input type="number" id="regNisn" class="form-control form-control-glass" placeholder="10 Digit NISN Resmi" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">No. Telepon / WhatsApp</label>
            <input type="tel" id="regHp" class="form-control form-control-glass" placeholder="08** **** ****" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Tingkat Kelas</label>
            <div class="segmented-control">
              <input type="radio" name="tingkat" id="t10" value="10" checked>
              <label for="t10">Kelas 10</label>
              <input type="radio" name="tingkat" id="t11" value="11">
              <label for="t11">Kelas 11</label>
              <input type="radio" name="tingkat" id="t12" value="12">
              <label for="t12">Kelas 12</label>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Jalur / Sistem</label>
            <div class="segmented-control">
              <input type="radio" name="jalur" id="jReg" value="Reguler" checked onchange="renderJurusanGrid()">
              <label for="jReg">Reguler</label>
              <input type="radio" name="jalur" id="jExc" value="Excellent" onchange="renderJurusanGrid()">
              <label for="jExc">Excellent (+)</label>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Rombel</label>
            <div class="segmented-control">
              <input type="radio" name="rombel" id="r1" value="1" checked>
              <label for="r1">Rombel 1</label>
              <input type="radio" name="rombel" id="r2" value="2">
              <label for="r2">Rombel 2</label>
              <input type="radio" name="rombel" id="r3" value="3">
              <label for="r3">Rombel 3</label>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Pilihan Jurusan</label>
            <div class="jurusan-grid" id="jurusanGridContainer"></div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label-custom">Nama Ayah</label>
              <input type="text" id="regAyah" class="form-control form-control-glass" placeholder="Nama Lengkap" required>
            </div>
            <div class="col-6">
              <label class="form-label-custom">Nama Ibu</label>
              <input type="text" id="regIbu" class="form-control form-control-glass" placeholder="Nama Lengkap" required>
            </div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Buat Password</label>
            <input type="password" id="regPassword" class="form-control form-control-glass" placeholder="Minimal 6 Karakter" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom text-info"><i class="fa-solid fa-key me-1"></i> Kode Unik Siswa</label>
            <input type="text" id="regKodeUnik" class="form-control form-control-glass border-info" placeholder="SISWAAVC2026" required>
          </div>

          <button type="submit" class="btn btn-glass">DAFTAR AKUN <i class="fa-solid fa-check-circle ms-2"></i></button>
        </form>

        <div class="toggle-text">
          Sudah punya akun? <a href="javascript:void(0)" onclick="switchForm('login'); return false;">Masuk ke Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth-siswa.js"></script>
</body>
</html>
